{{ define "title" }}New idea{{ end }}
{{ define "script-tags" }}{{ end }}
{{ define "page-content" }}
  <div class="flex flex-col gap-6 pt-6">
    <h1 class="text-2xl font-bold">New idea</h1>
    <form class="flex flex-col gap-4" action="/ideas" method="post">
      <textarea
        name="text"
        class="textarea textarea-bordered w-full h-48 text-base resize-none"
        placeholder="What's on your mind?"
        autofocus
        required
      ></textarea>
      <button type="submit" class="btn btn-primary w-full">Dump it</button>
    </form>
  </div>
{{ end }}
