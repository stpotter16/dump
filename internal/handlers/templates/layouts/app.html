{{ define "content" }}
  <main class="max-w-lg mx-auto px-4 pt-4 pb-24">
    {{ block "page-content" . }}{{ end }}
  </main>
  <nav class="dock">
    <a href="/" class="{{ if eq .ActivePage "new" }}dock-active{{ end }}">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="size-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
        />
      </svg>
      <span class="dock-label">New</span>
    </a>
    <a
      href="/review"
      class="{{ if eq .ActivePage "review" }}dock-active{{ end }}"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="size-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
        />
      </svg>
      <span class="dock-label">Review</span>
    </a>
  </nav>
{{ end }}
