<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Brain silhouette (top-down view) -->
  <path fill="#7c3aed" d="
    M16,6
    C13,6 10,7 8,9.5
    C6,12 5.5,15 6,18
    C6.5,21 8,23.5 10.5,25
    C12,25.8 14,26.5 16,26.5
    C18,26.5 20,25.8 21.5,25
    C24,23.5 25.5,21 26,18
    C26.5,15 26,12 24,9.5
    C22,7 19,6 16,6Z
  "/>
  <!-- Center groove dividing hemispheres -->
