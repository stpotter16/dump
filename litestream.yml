# S3 credentials are not set per-db here — this litestream instance uses
# one shared identity across every bucket it replicates, configured once
# at the process/box level. See systemd/SETUP.md.
dbs:
  - path: ${DUMP_DB_PATH}/dump.sqlite
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: db
        endpoint: ${LITESTREAM_ENDPOINT}
        force-path-style: true
        retention: 168h # 7 days
        snapshot-interval: 24h
        validation-interval: 72h
        sync-interval: 1s
